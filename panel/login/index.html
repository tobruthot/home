<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — TOBRUTHOT</title><style>
:root{--bg:#101014;--panel:#1b1a22;--line:#34313d;--pink:#ec367b;--muted:#aaa7b4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#3a1d35,transparent 38%),var(--bg);color:#fff;font:15px Arial,sans-serif;padding:20px}
.card{width:min(420px,100%);background:#1b1a22;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 20px 70px #0008}
.brand{font-size:26px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--pink)}p{color:var(--muted);line-height:1.5}label{display:block;margin:22px 0 8px;color:#ddd}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#111116;color:#fff;font-size:16px;outline:none}input:focus{border-color:var(--pink)}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--pink);color:white;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.msg{margin-top:14px;color:#ff8eae;min-height:20px;font-size:13px}.back{display:block;text-align:center;color:#c7c2ce;margin-top:22px;text-decoration:none;font-size:13px}
</style></head><body><main class="card"><div class="brand">TOBRU<span>THOT</span></div><h1>Admin Login</h1><p>Masuk untuk mengelola video, kode VIP, dan banner slider.</p>
<form id="loginForm"><label for="password">Password admin</label><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password admin"><button id="submit" type="submit">MASUK DASHBOARD</button><div class="msg" id="msg" role="status"></div></form>
<a class="back" href="/home/">← Kembali ke halaman utama</a></main>
<script>
const API = "https://script.google.com/macros/s/AKfycbxqINgb_M0tdPCkM9QTeduy6LxSMQMUUl4lWOPeHfdx2Adu1dNvT-BZD8wPtAzXsMo/exec";
async function callApi(payload){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});
 return await r.json();
}
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const btn=document.getElementById("submit"),msg=document.getElementById("msg");
 btn.disabled=true;msg.textContent="Memeriksa login...";
 try{const out=await callApi({action:"loginAdmin",password:document.getElementById("password").value});
 if(!out.success)throw new Error(out.message||"Login gagal");
 sessionStorage.setItem("tb_admin_token",out.data.sessionToken);
 location.href="/home/panel/dashboard/index.html";
 }catch(err){msg.textContent=err.message||"Tidak dapat menghubungi API."}
 finally{btn.disabled=false}
});
</script></body></html>
