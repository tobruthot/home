<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slider — TOBRUTHOT</title><style>
:root{--bg:#101014;--panel:#1b1a22;--line:#34313d;--pink:#ec367b;--muted:#aaa7b4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Arial,sans-serif}.top{padding:18px 5%;background:#1a1920;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.cols{display:grid;grid-template-columns:380px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}label{display:block;margin:13px 0 7px}input,select{width:100%;padding:11px;background:#111116;border:1px solid var(--line);border-radius:8px;color:#fff}.hint{font-size:12px;color:var(--muted);line-height:1.5}.btn{padding:11px 14px;border:0;border-radius:8px;background:var(--pink);color:#fff;font-weight:bold;cursor:pointer;margin-top:12px}.btn.gray{background:#393541}.slide{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.slide img{width:100%;height:95px;object-fit:cover;border-radius:8px;background:#111}@media(max-width:800px){.cols{grid-template-columns:1fr}.slide{grid-template-columns:110px 1fr}}
</style></head><body><header class="top"><b>TOBRUTHOT / SLIDER</b><a href="/home/panel/dashboard/index.html">← Dashboard</a></header><main class="wrap"><h1>Slider halaman depan</h1><p class="hint">Setiap slider yang berstatus Aktif akan tampil di halaman depan. Tambah 4 slider berarti homepage otomatis menampilkan 4 slide dan 4 indikator.</p><div class="cols"><section class="panel"><h2 id="formTitle">Tambah slider</h2><form id="form"><input type="hidden" id="slideId">
<label>Judul slide *</label><input id="title" required maxlength="120" placeholder="Judul banner">
<label>Link gambar banner *</label><input id="imageUrl" type="url" required placeholder="https://.../banner.jpg">
<label>Link tujuan (opsional)</label><input id="linkUrl" type="url" placeholder="https://...">
<label>Teks tombol</label><input id="buttonText" maxlength="40" placeholder="Lihat selengkapnya">
<label>Urutan tampil</label><input id="sortOrder" type="number" value="1" min="0">
<label>Status</label><select id="status"><option value="ACTIVE">Aktif</option><option value="INACTIVE">Nonaktif</option></select>
<button class="btn" id="save" type="submit">Simpan slider</button><button class="btn gray" id="reset" type="button">Reset</button><div id="msg" class="hint"></div></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Daftar slider</h2><button class="btn gray" id="refresh" style="margin:0">Refresh</button></div><div id="list" class="hint">Memuat...</div></section></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbz-Kn2Dvg9yq3k80qpSf6bkDgg_pVti92rrc0v5428jK1yaSCroRu1HPdU0mE754oI2NA/exec",token=sessionStorage.getItem("tb_admin_token");if(!token)location.replace("/home/panel/login/index.html");const $=id=>document.getElementById(id);
async function api(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,sessionToken:token,...extra})});const j=await r.json();if(!j.success)throw new Error(j.message||"API error");return j.data}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function reset(){ $("form").reset();$("slideId").value="";$("sortOrder").value="1";$("formTitle").textContent="Tambah slider";$("save").textContent="Simpan slider";$("msg").textContent=""}
$("reset").onclick=reset;
$("form").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;try{await api("saveSlide",{slide:{slideId:$("slideId").value,title:$("title").value,imageUrl:$("imageUrl").value,linkUrl:$("linkUrl").value,buttonText:$("buttonText").value,sortOrder:$("sortOrder").value,status:$("status").value}});$("msg").textContent="Slider tersimpan.";reset();await load()}catch(err){$("msg").textContent=err.message}finally{$("save").disabled=false}};
async function load(){try{const items=await api("listAdminSlides");$("list").innerHTML=items.length?items.map(s=>`<div class="slide"><img src="${esc(s.imageUrl)}" alt=""><div><b>${esc(s.title)}</b><div class="hint">Urutan ${s.sortOrder} · ${s.status}</div><div class="hint">${esc(s.linkUrl||"Tanpa link tujuan")}</div><button class="btn gray" data-edit="${esc(s.slideId)}">Edit</button><button class="btn gray" data-delete="${esc(s.slideId)}">Hapus</button></div></div>`).join(""):"Belum ada slider.";
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const s=items.find(x=>x.slideId===b.dataset.edit);$("slideId").value=s.slideId;$("title").value=s.title;$("imageUrl").value=s.imageUrl;$("linkUrl").value=s.linkUrl||"";$("buttonText").value=s.buttonText||"";$("sortOrder").value=s.sortOrder;$("status").value=s.status;$("formTitle").textContent="Edit slider";$("save").textContent="Simpan perubahan";window.scrollTo({top:0,behavior:"smooth"})});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Hapus slider ini?")){await api("deleteSlide",{slideId:b.dataset.delete});await load()}})}catch(e){$("list").textContent=e.message}}
$("refresh").onclick=load;load();
</script></body></html>
